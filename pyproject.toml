[project]
name            = "power1d"
version         = "0.1.18"
description     = "Numerical Power Estimates for One-Dimensional Continua"
readme          = "README.md"
requires-python = ">=3.7"
license         = "GPL-3.0-or-later"
license-files   = ["LICENSE.txt"]

keywords        = [
	"statistics",
	"probability",
	"hypothesis testing",
	"functional data analysis",
	"time series analysis",
	"continuum data analysis"
]

authors         = [
	{name = "Todd Pataky", email = "0todd0@gmail.com" } # Optional
]

classifiers = [
	"Development Status :: 4 - Beta",
	"Topic :: Scientific/Engineering",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
]


dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
]





[project.urls]  # Optional
"Homepage"    = "https://spm1d.org/power1d"
"Source"      = "https://github.com/spm1d-org/power1d"
"Bug Reports" = "https://github.com/spm1d-org/power1d/issues"




[tool.setuptools]
package-data  = {"power1d.data.weather" = ["*.py", "*.npz", "*.npy", "*.rda", "*.txt"]}




[build-system]
requires      = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"
