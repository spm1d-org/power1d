name: test

#  Run the tests on every push to any branch and on pull requests.  Nothing is
#  published.  publish.yml calls this workflow too (workflow_call), so a
#  release is gated on a green test run.

on:
    push:
        branches: [ '**' ]
    pull_request:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    pytest:
        name: pytest (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: python -m pip install -U pip pytest pytest-explicit numpy scipy matplotlib

            - name: Run tests
              run: |
                  export PYTHONPATH=src
                  python -m pytest tests/
