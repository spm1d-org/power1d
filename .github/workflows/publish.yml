name: publish

#  Publish a release when a version tag is pushed:
#
#      python scripts/update_version.py 0.1.16
#      git commit -am "version 0.1.16"
#      git tag v0.1.16
#      git push && git push --tags
#
#  In order, stopping at the first failure:  check that the tagged commit is on
#  master and that the tag matches the version in every file;  run the tests;
#  upload to PyPI;  create the GitHub Release with automatic notes;  build the
#  docs and signal spm1d.org.  Pushing commits (to any branch) publishes nothing.

on:
    push:
        tags: [ 'v*' ]

permissions:
    contents: write                       # to create the GitHub Release

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0          # all branches, to find the tagged commit on master

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Check that the tagged commit is on master
              run: |
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
                      echo "::error::the commit tagged $GITHUB_REF_NAME is not on master;  nothing is published"
                      exit 1
                  fi

            - name: Check that the tag matches the version in every file
              run: python scripts/update_version.py --check "${GITHUB_REF_NAME#v}"

    test:
        needs: check
        uses: ./.github/workflows/test.yml

    pypi:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'

            - name: Build
              run: |
                  python -m pip install -U pip build
                  python -m build .

            - name: Publish
              uses: pypa/gh-action-pypi-publish@v1.14.2
              with:
                  password: ${{ secrets.PYPI_TOKEN }}

    release:
        needs: pypi
        runs-on: ubuntu-latest
        steps:
            - name: Create the GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

    docs:
        needs: release
        uses: ./.github/workflows/docs.yml
        secrets: inherit
